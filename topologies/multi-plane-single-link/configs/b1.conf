frr version 10.5
frr defaults datacenter
hostname b1
log stdout
service integrated-vtysh-config
interface lo
 ipv6 address fc00:c::2/64
interface eth1
 ipv6 address fd00:10:2::2/64
interface eth2
 ipv6 address fd00:10:5::1/64
interface eth3
 ipv6 address fd00:10:6::1/64
router bgp 65012
 bgp router-id 10.255.0.12
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor fd00:10:5::2 remote-as 65013
 neighbor fd00:10:5::2 timers 1 3
 neighbor fd00:10:6::2 remote-as 65014
 neighbor fd00:10:6::2 timers 1 3
 address-family ipv6 unicast
  redistribute connected
  redistribute static
  maximum-paths 8
  neighbor fd00:10:5::2 activate
  neighbor fd00:10:6::2 activate
 exit-address-family
ipv6 route fc00:200::/48 fd00:10:2::1
ipv6 route fc00:c8::d/128 fd00:10:2::1
