frr version 10.5
frr defaults datacenter
hostname s22
log stdout
service integrated-vtysh-config
interface lo
 ipv6 address fc00:18::2/64
interface eth1
 ipv6 address fd00:10:a::2/64
interface eth2
 ipv6 address fd00:10:c::2/64
router bgp 65024
 bgp router-id 10.255.0.24
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor fd00:10:a::1 remote-as 65021
 neighbor fd00:10:a::1 timers 1 3
 neighbor fd00:10:c::1 remote-as 65022
 neighbor fd00:10:c::1 timers 1 3
 address-family ipv6 unicast
  redistribute connected
  redistribute static
  maximum-paths 8
  neighbor fd00:10:a::1 activate
  neighbor fd00:10:c::1 activate
 exit-address-family
