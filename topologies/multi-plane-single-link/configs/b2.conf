frr version 10.5
frr defaults datacenter
hostname b2
log stdout
service integrated-vtysh-config
interface lo
 ipv6 address fc00:16::2/64
interface eth1
 ipv6 address fd00:10:8::2/64
interface eth2
 ipv6 address fd00:10:b::1/64
interface eth3
 ipv6 address fd00:10:c::1/64
router bgp 65022
 bgp router-id 10.255.0.22
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor fd00:10:b::2 remote-as 65023
 neighbor fd00:10:b::2 timers 1 3
 neighbor fd00:10:c::2 remote-as 65024
 neighbor fd00:10:c::2 timers 1 3
 address-family ipv6 unicast
  redistribute connected
  redistribute static
  maximum-paths 8
  neighbor fd00:10:b::2 activate
  neighbor fd00:10:c::2 activate
 exit-address-family
ipv6 route fc00:200::/48 fd00:10:8::1
