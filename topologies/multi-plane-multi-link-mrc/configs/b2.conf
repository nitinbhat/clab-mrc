frr version 10.5
frr defaults datacenter
hostname b2
log stdout
service integrated-vtysh-config
interface eth1
 ipv6 address fd00:10:a::2/64
interface eth2
 ipv6 address fd00:10:c::2/64
interface eth3
 ipv6 address fd00:10:f::1/64
interface eth4
 ipv6 address fd00:10:10::1/64
ipv6 route fcbb:0:e221::/48 fd00:10:a::1 eth1
ipv6 route fcbb:0:e222::/48 fd00:10:c::1 eth2
ipv6 route fcbb:0:5210::/48 fd00:10:f::2 eth3
ipv6 route fcbb:0:5220::/48 fd00:10:10::2 eth4
