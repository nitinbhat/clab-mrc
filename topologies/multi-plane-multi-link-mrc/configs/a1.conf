frr version 10.5
frr defaults datacenter
hostname a1
log stdout
service integrated-vtysh-config
interface eth1
 ipv6 address fd00:10:1::2/64
interface eth2
 ipv6 address fd00:10:3::2/64
interface eth3
 ipv6 address fd00:10:5::1/64
interface eth4
 ipv6 address fd00:10:6::1/64
ipv6 route fcbb:0:e111::/48 fd00:10:1::1 eth1
ipv6 route fcbb:0:e112::/48 fd00:10:3::1 eth2
ipv6 route fcbb:0:5110::/48 fd00:10:5::2 eth3
ipv6 route fcbb:0:5120::/48 fd00:10:6::2 eth4
