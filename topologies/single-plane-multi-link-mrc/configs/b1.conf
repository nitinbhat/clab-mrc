ipv6 route fcbb:0:e211::/48 fd00:10:2::1 eth1
ipv6 route fcbb:0:e212::/48 fd00:10:4::1 eth2
ipv6 route fcbb:0:5110::/48 fd00:10:7::2 eth3
ipv6 route fcbb:0:5120::/48 fd00:10:8::2 eth4
